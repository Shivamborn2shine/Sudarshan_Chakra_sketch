<svg width="240" height="80" viewBox="0 0 240 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Loopa signature Purple to Lime vivid gradient -->
    <linearGradient id="loopaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#7C3AED" />
      <stop offset="35%" stopColor="#A855F7" />
      <stop offset="70%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#84CC16" />
    </linearGradient>
    <filter id="loopGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C3AED" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Continuous Möbius Loop Icon -->
  <g transform="translate(10, 8)" filter="url(#loopGlow)">
    <path
      d="M 28 32 C 16 16, 2 24, 2 32 C 2 40, 16 48, 28 32 C 40 16, 54 24, 54 32 C 54 40, 40 48, 28 32 Z"
      stroke="url(#loopaGrad)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Forward energy dot -->
    <circle cx="50" cy="27" r="3" fill="#84CC16" />
  </g>

  <!-- Loopa Wordmark -->
  <text x="82" y="44" font-family="Space Grotesk, system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em" fill="#18181B">
    loopa
  </text>

  <!-- Category badge -->
  <rect x="174" y="27" width="56" height="18" rx="9" fill="#84CC16" fill-opacity="0.15" stroke="#84CC16" stroke-width="1" />
  <text x="202" y="39.5" font-family="Space Grotesk, system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="0.08em" text-anchor="middle" fill="#4D7C0F">
    LOYALTY
  </text>
</svg>
